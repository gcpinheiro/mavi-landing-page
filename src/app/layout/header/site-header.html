<header class="header"><div class="container header-inner">
  <a class="brand" href="#inicio" aria-label="MAVI Comunicação, início" (click)="closeMenu()"><img src="brand/mavi-logo.png" alt="MAVI Comunicação" width="145" height="76" /></a>
  <button #menuToggle class="menu-toggle" type="button" aria-controls="main-nav" [attr.aria-expanded]="menuOpen()" [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'" (click)="menuOpen.set(!menuOpen())"><span>{{ menuOpen() ? 'Fechar' : 'Menu' }}</span><span aria-hidden="true">{{ menuOpen() ? '×' : '☰' }}</span></button>
  <nav id="main-nav" aria-label="Navegação principal" [class.is-open]="menuOpen()">
    <a href="#sobre" (click)="closeMenu()">A MAVI</a><a href="#servicos" (click)="closeMenu()">Serviços</a><a href="#portfolio" (click)="closeMenu()">Portfólio</a><a href="#como-funciona" (click)="closeMenu()">Como funciona</a><a href="#feedbacks" (click)="closeMenu()">Feedbacks</a><a class="nav-contact" href="#contato" (click)="closeMenu()">Vamos conversar <app-icon /></a>
  </nav>
</div></header>
